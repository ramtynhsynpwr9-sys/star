{
  "log": {
    "loglevel": "warning"
  },
  "inbounds": [
    {
      "port": 10808,
      "protocol": "socks",
      "settings": {
        "auth": "noauth",
        "udp": true
      },
      "sniffing": {
        "enabled": true,
        "destOverride": ["http", "tls"]
      }
    },
    {
      "port": 10809,
      "protocol": "http",
      "sniffing": {
        "enabled": true,
        "destOverride": ["http", "tls"]
      }
    }
  ],
  "outbounds": [
    {
      "protocol": "vmess",
      "settings": {
        "vnext": [
          {
            "address": "YOUR_SERVER_ADDRESS",
            "port": 443,
            "users": [
              {
                "id": "YOUR_UUID_HERE",
                "alterId": 0,
                "security": "auto"
              }
            ]
          }
        ]
      },
      "streamSettings": {
        "network": "ws",
        "wsSettings": {
          "path": "/ray"
        },
        "security": "tls",
        "tlsSettings": {
          "serverName": "YOUR_SERVER_ADDRESS"
        }
      },
      "mux": {
        "enabled": true,
        "concurrency": 8
      },
      "tag": "proxy"
    },
    {
      "protocol": "freedom",
      "tag": "direct"
    },
    {
      "protocol": "blackhole",
      "tag": "block"
    }
  ],
  "routing": {
    "rules": [
      {
        "type": "field",
        "domain": ["geosite:ir"],
        "outboundTag": "direct"
      },
      {
        "type": "field",
        "ip": ["geoip:ir"],
        "outboundTag": "direct"
      },
      {
        "type": "field",
        "domain": ["geosite:pubg"],
        "outboundTag": "proxy"
      }
    ]
  }
}
